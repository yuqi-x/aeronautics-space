# ---- 构建内存 ----
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true

# ---- 本机代理（直连 maven 会被 RST，实测必须走 9674）----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=9674
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=9674
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]

# ---- 模组信息 ----
mod_version=0.1.0
mod_group=com.yuqi.aeronauticsspace
mod_id=aeronautics_space

# ---- 平台版本（已核对官方 maven 元数据）----
minecraft_version=1.21.1
neoforge_version=21.1.256
moddevgradle_version=2.0.148
